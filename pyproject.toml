[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transportable-causal-bootstrapping"
version = "0.1.0"
description = "Transport formula analysis, transportable causal weights, and bootstrap sampling"
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
    "numpy>=1.23,<2",
    "scipy>=1.9,<2",
    "grapl-causal==1.6.1",
    "causalbootstrapping>=0.2.5,<0.3",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]
demo = ["jupyterlab>=3", "nbformat>=5", "nbclient>=0.5", "pandas>=1.5", "seaborn>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
